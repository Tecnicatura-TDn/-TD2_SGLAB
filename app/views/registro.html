<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <main class="contenedor">
        <form class="tarjeta" action="registro.php" method="POST" novalidate>
            <h1>Crear cuenta</h1>

            <p class="error">{{error}}</p>

            <input type="hidden" name="csrf" value="{{csrf}}">

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" value="{{nombre}}"
                       placeholder="Tu nombre" maxlength="100" required autofocus>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" value="{{email}}"
                       placeholder="tu@correo.com" maxlength="150" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>

            <div class="campo">
                <label for="password_confirm">Repite la contraseña</label>
                <input type="password" id="password_confirm" name="password_confirm"
                       placeholder="••••••••" minlength="8" required>
            </div>

            <button type="submit" class="boton">Registrarme</button>

            <p class="enlace">¿Ya tienes cuenta? <a href="login.php">Inicia sesión</a></p>
        </form>
    </main>
</body>
</html>
