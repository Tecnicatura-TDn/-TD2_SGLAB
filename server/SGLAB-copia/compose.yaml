name: ${COMPOSE_PROJECT_NAME:-sglab-copia}

services:
  web:
    build:
      context: ./server/web
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT:-8080}:80"

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME no definido}
      DB_USER: ${DB_APP_USER:?DB_APP_USER no definido}
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD no definido}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - sglab_network

  db:
    image: mariadb:11.4

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD no definido}

      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER no definido}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD no definido}

      DB_INGEST_USER: ${DB_INGEST_USER:?DB_INGEST_USER no definido}
      DB_INGEST_PASSWORD: ${DB_INGEST_PASSWORD:?DB_INGEST_PASSWORD no definido}

      DB_BACKUP_USER: ${DB_BACKUP_USER:?DB_BACKUP_USER no definido}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?DB_BACKUP_PASSWORD no definido}

    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro,Z

    ports:
      - "127.0.0.1:${DB_BIND_PORT:-3306}:3306"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - sglab_network

volumes:
  db_data:
    external: true
    name: sglab_db_data

networks:
  sglab_network:
    driver: bridge
