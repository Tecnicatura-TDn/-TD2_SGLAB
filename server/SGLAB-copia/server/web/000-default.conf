# TLS termina en el propio Apache: PHP recibe HTTPS=on y la IP del cliente.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" sglab_safe

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    # Origen fijo del despliegue; nunca construir la redirección desde Host.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [F,L]
    RewriteRule ^ ${SGLAB_HTTPS_ORIGIN}%{REQUEST_URI} [R=301,L,NE]

    ErrorDocument 403 "Abrir SGLAB mediante HTTPS antes de enviar formularios."
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log sglab_safe
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLCertificateFile /etc/sglab/tls/server.crt
    SSLCertificateKeyFile /etc/sglab/tls/server.key

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Evitar registrar códigos OAuth y state en la query de la URL.
    CustomLog ${APACHE_LOG_DIR}/access.log sglab_safe
</VirtualHost>
