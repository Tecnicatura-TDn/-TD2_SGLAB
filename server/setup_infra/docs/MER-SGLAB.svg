<text x="60" y="1915" font-size="18">Relaciones (hijo → padre)</text>
<text x="60" y="1945" font-size="12">1. asignacion_docente (asignado_por_ci) → usuarios</text>
<text x="960" y="1945" font-size="12">2. asignacion_docente (id_laboratorio) → laboratorio</text>
<text x="60" y="1969" font-size="12">3. asignacion_docente (usuario_ci) → usuarios</text>
<text x="960" y="1969" font-size="12">4. comentario (autor_ci) → usuarios</text>
<text x="60" y="1993" font-size="12">5. comentario (id_equipo) → equipo</text>
<text x="960" y="1993" font-size="12">6. comentario_laboratorio (autor_ci) → usuarios</text>
<text x="60" y="2017" font-size="12">7. comentario_laboratorio (id_laboratorio) → laboratorio</text>
<text x="960" y="2017" font-size="12">8. equipo (id_laboratorio) → laboratorio</text>
<text x="60" y="2041" font-size="12">9. registro (id_equipo) → equipo</text>
<text x="960" y="2041" font-size="12">10. registro (id_laboratorio_observado) → laboratorio</text>
<text x="60" y="2065" font-size="12">11. registro (usuario_ci) → usuarios</text>
<text x="960" y="2065" font-size="12">12. registro_disco (id_registro) → registro</text>
<text x="60" y="2089" font-size="12">13. registro_sistema_archivos (id_registro, orden_disco) → registro_disco</text>
<text x="960" y="2089" font-size="12">14. registro_sistema_archivos (id_registro) → registro</text>
</svg>